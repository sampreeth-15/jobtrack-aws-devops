<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JobTrack - Add Job</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="page-container">

    <!-- Header -->
    <div class="top-bar">

        <div>
            <h1>JobTrack</h1>
            <p>Add a new job application</p>
        </div>

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

    </div>


    <!-- Add Job Form -->
    <div class="form-card">

        <h2>Add Job Application</h2>

        <form method="POST"
              action="{{ url_for('add_job') }}">


            <!-- Company -->
            <div class="form-group">

                <label for="company">
                    Company Name
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="e.g. Amazon"
                    required>

            </div>


            <!-- Role -->
            <div class="form-group">

                <label for="role">
                    Job Role
                </label>

                <input
                    type="text"
                    id="role"
                    name="role"
                    placeholder="e.g. AWS DevOps Engineer"
                    required>

            </div>


            <!-- Location -->
            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="e.g. Bangalore / Remote">

            </div>


            <!-- Job Type -->
            <div class="form-group">

                <label for="job_type">
                    Job Type
                </label>

                <select
                    id="job_type"
                    name="job_type">

                    <option value="">
                        Select Job Type
                    </option>

                    <option value="Full Time">
                        Full Time
                    </option>

                    <option value="Part Time">
                        Part Time
                    </option>

                    <option value="Contract">
                        Contract
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                    <option value="Remote">
                        Remote
                    </option>

                </select>

            </div>


            <!-- Application Date -->
            <div class="form-group">

                <label for="application_date">
                    Application Date
                </label>

                <input
                    type="date"
                    id="application_date"
                    name="application_date">

            </div>


            <!-- Job URL -->
            <div class="form-group">

                <label for="job_url">
                    Job URL
                </label>

                <input
                    type="url"
                    id="job_url"
                    name="job_url"
                    placeholder="https://example.com/job">

            </div>


            <!-- Salary -->
            <div class="form-group">

                <label for="salary">
                    Salary
                </label>

                <input
                    type="text"
                    id="salary"
                    name="salary"
                    placeholder="e.g. 8 LPA">

            </div>


            <!-- Status -->
            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    required>

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

            </div>


            <!-- Notes -->
            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="5"
                    placeholder="Add notes about this application..."></textarea>

            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <button
                    type="submit"
                    class="login-button">
                    Add Job
                </button>

                <a
                    href="{{ url_for('dashboard') }}"
                    class="cancel-button">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
